<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">TIME TRACKER</div>
        <h1>Clock</h1>
      </div>

      <button
        id="adminBtn"
        class="icon-btn"
        type="button"
        aria-label="Admin access"
      >
        🔒
      </button>
    </header>

    <section class="hero card">
      <div id="status" class="status">CLOCKED OUT</div>
      <div class="label">THIS PAY WEEK</div>
      <div id="weekHours" class="hours">0h 00m</div>
      <div id="weekPay" class="money">$0.00</div>
      <div id="rate" class="muted">$00.00/hr</div>

      <div id="liveBlock" class="live hidden">
        <span id="liveTime">00:00:00</span>
        <span id="livePay">$0.00 current shift</span>
      </div>

      <button
        id="clockBtn"
        class="primary hidden"
        type="button"
      >
        Clock In
      </button>

      <button
        id="custom-clock-in-button"
        class="secondary hidden"
        type="button"
      >
        Forgot to clock in?
      </button>

      <div
        id="custom-clock-in-panel"
        class="clock-time-editor"
        hidden
      >
        <label for="custom-clock-in-time">
          Actual start time
        </label>

        <input
          id="custom-clock-in-time"
          type="datetime-local"
        >

        <button
          id="confirm-custom-clock-in"
          class="secondary"
          type="button"
        >
          Start shift at this time
        </button>

        <p
          id="custom-clock-message"
          class="form-message"
          aria-live="polite"
        ></p>
      </div>

      <div
        id="active-clock-editor"
        class="active-clock-editor"
        hidden
      >
        <label for="active-clock-in">
          Clock-in time
        </label>

        <input
          id="active-clock-in"
          type="datetime-local"
        >

        <button
          id="save-active-clock-in"
          class="secondary"
          type="button"
        >
          Save clock-in time
        </button>

        <p
          id="active-clock-message"
          class="form-message"
          aria-live="polite"
        ></p>
      </div>

      <div id="publicHint" class="hint">
        Public view · unlock to manage
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Recent activity</h2>

        <div class="header-links">
          <a href="settings.html">Settings</a>
          <a href="shifts.html">Edit</a>
          <a href="reports.html">Reports →</a>
        </div>
      </div>

      <div id="recent" class="list">
        <div class="empty">No shifts yet.</div>
      </div>
    </section>
  </main>

  <dialog id="loginDialog">
    <form id="loginForm" class="dialog-card">
      <h2>Admin access</h2>
      <p>Unlock clock controls for this browser session.</p>

      <label>
        Password
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </label>

      <div
        id="loginError"
        class="error"
        aria-live="polite"
      ></div>

      <div class="actions">
        <button
          id="loginCancel"
          type="button"
          class="secondary"
        >
          Cancel
        </button>

        <button
          id="loginSubmit"
          type="submit"
          class="primary"
        >
          Unlock
        </button>
      </div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
